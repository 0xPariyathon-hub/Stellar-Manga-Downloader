<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Stellar Manga Downloader Pro</title>
    <style>
        :root {
            --bg-color: #0f111a;
            --sidebar-color: #16192b;
            --card-color: #1e2238;
            --text-color: #ffffff;
            --text-muted: #8f9bb3;
            --accent-color: #7000ff;
            --accent-hover: #8522ff;
            --btn-green: #00e676;
            --btn-red: #ff3d00;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* Custom Title Bar */
        .title-bar { height: 35px; background: #08090f; display: flex; justify-content: space-between; align-items: center; -webkit-app-region: drag; padding-left: 15px; }
        .title-bar span { font-size: 12px; font-weight: bold; color: var(--text-muted); }
        .window-controls { display: flex; -webkit-app-region: no-drag; }
        .window-btn { width: 45px; height: 35px; background: transparent; border: none; color: var(--text-color); cursor: pointer; font-size: 12px; transition: 0.2s; }
        .window-btn:hover { background: #2d334a; }
        .window-btn.close:hover { background: var(--btn-red); }

        /* Main Layout */
        .app-container { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 220px; background: var(--sidebar-color); display: flex; flex-direction: column; padding: 20px 10px; }
        .logo h2 { font-size: 18px; color: var(--text-color); }
        .logo p { font-size: 11px; color: var(--text-muted); margin-bottom: 25px; }
        
        .menu-btn { background: transparent; border: none; color: var(--text-muted); padding: 12px 15px; text-align: left; font-size: 14px; border-radius: 8px; cursor: pointer; margin-bottom: 5px; transition: 0.2s; }
        .menu-btn:hover, .menu-btn.active { background: var(--accent-color); color: var(--text-color); font-weight: bold; box-shadow: 0 0 15px rgba(112, 0, 255, 0.4); }

        .content { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; }
        .page { display: none; flex-direction: column; flex: 1; }
        .page.active { display: flex; }

        /* Cards & Controls */
        .card { background: var(--card-color); padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.05); }
        .control-row { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
        .control-row:last-child { margin-bottom: 0; }

        input, select { background: #11131f; border: 1px solid #2d334a; color: var(--text-color); padding: 8px 12px; border-radius: 6px; font-size: 13px; outline: none; }
        input[type="text"] { flex: 1; }
        
        button.action-btn { background: var(--accent-color); color: var(--text-color); border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; transition: 0.2s; }
        button.action-btn:hover { background: var(--accent-hover); box-shadow: 0 0 10px rgba(112,0,255,0.5); }
        button.green-btn { background: var(--btn-green); color: #000; }
        button.red-btn { background: var(--btn-red); color: #fff; }

        /* Image Grid Preview */
        .image-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; overflow-y: auto; flex: 1; padding: 5px; }
        .image-card { background: var(--card-color); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; align-items: center; position: relative; border: 1px solid rgba(255,255,255,0.05); }
        .image-card img { width: 100%; height: 220px; object-fit: cover; border-radius: 6px; margin-bottom: 8px; }
        .image-card input[type="checkbox"] { position: absolute; top: 15px; left: 15px; width: 18px; height: 18px; cursor: pointer; }
        .page-badge { font-size: 12px; font-weight: bold; color: var(--text-muted); }

        /* History Table */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: var(--card-color); border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px 15px; text-align: left; font-size: 13px; border-bottom: 1px solid #2d334a; }
        th { background: #2d334a; color: var(--text-color); }
        tr:hover { background: rgba(255,255,255,0.02); }

        /* Custom Modal Notification */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-box { background: var(--card-color); padding: 25px; border-radius: 14px; width: 380px; border: 1px solid #2d334a; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .modal-box h3 { margin-bottom: 10px; font-size: 16px; }
        .modal-box p { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }
    </style>
</head>
<body>

    <!-- Custom Title Bar -->
    <div class="title-bar">
        <span>✨ Stellar Manga Downloader Pro (Electron Edition)</span>
        <div class="window-controls">
            <button class="window-btn" onclick="minimizeWindow()">—</button>
            <button class="window-btn close" onclick="closeWindow()">✕</button>
        </div>
    </div>

    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="logo">
                <h2>✨ Stellar</h2>
                <p>Manga Downloader</p>
            </div>
            <button class="menu-btn active" onclick="switchPage('downloader', this)">📥 Dashboard / โหลด</button>
            <button class="menu-btn" onclick="switchPage('history', this)">📊 ประวัติการดาวน์โหลด</button>
        </div>

        <!-- Main Content Area -->
        <div class="content">
            <!-- Page 1: Downloader -->
            <div id="downloader" class="page active">
                <div class="card">
                    <div class="control-row">
                        <label style="font-weight:bold; font-size:13px;">URL:</label>
                        <input type="text" id="urlInput" placeholder="วางลิงก์หน้ามังงะที่นี่...">
                        <span id="statusBadge" style="color:var(--btn-green); font-size:12px; font-weight:bold;">● พร้อมใช้งาน</span>
                    </div>
                    <div class="control-row">
                        <label style="font-size:13px; color:var(--text-muted);">ระบบกรอง:</label>
                        <select id="filterMode">
                            <option value="smart">1. โหมดฉลาด (แนะนำ ตัดโฆษณาอัตโนมัติ)</option>
                            <option value="all">2. ดึงรูปภาพทั้งหมดบนเว็บ</option>
                        </select>
                        <button class="action-btn" onclick="fetchImages()">🔍 ดึงรูปภาพ</button>
                    </div>
                    <div class="control-row" style="margin-top: 15px; border-top: 1px solid #2d334a; padding-top: 15px;">
                        <button class="action-btn" style="background:#2d334a;" onclick="selectFolder()">📂 เลือกที่เก็บ</button>
                        <span id="folderPathDisplay" style="font-size:12px; color:var(--text-muted); width: 200px; overflow:hidden; text-overflow:ellipsis;">ยังไม่ได้เลือกโฟลเดอร์</span>
                        
                        <label style="font-size:13px; color:var(--text-muted); margin-left:10px;">ชื่อโฟลเดอร์:</label>
                        <input type="text" id="folderNameInput" value="Manga_Chapter_01" style="width: 150px;">
                        
                        <div style="margin-left: auto; display: flex; gap: 8px;">
                            <button class="action-btn" style="background:#2d334a;" onclick="toggleSelectAll(true)">☑️ เลือกทั้งหมด</button>
                            <button class="action-btn red-btn" onclick="deleteSelectedImages()">🗑️ ซ่อนที่เลือก</button>
                            <button class="action-btn green-btn" onclick="downloadImages()" id="dlBtn" disabled>📥 ดาวน์โหลด</button>
                        </div>
                    </div>
                </div>

                <div class="card" style="flex: 1; display: flex; flex-direction: column; overflow: hidden; padding: 10px;">
                    <div id="imageGrid" class="image-grid">
                        <!-- รูปภาพพรีวิวจะแสดงตรงนี้ -->
                    </div>
                </div>
            </div>

            <!-- Page 2: History -->
            <div id="history" class="page">
                <h3 style="margin-bottom: 15px;">📊 ประวัติการดาวน์โหลดโฟลเดอร์ทั้งหมด</h3>
                <div style="flex: 1; overflow-y: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>เวลาที่ดาวน์โหลด</th>
                                <th>ชื่อโฟลเดอร์</th>
                                <th>จำนวนรูป</th>
                                <th>ที่อยู่โฟลเดอร์ (Path)</th>
                            </tr>
                        </thead>
                        <tbody id="historyTableBody">
                            <!-- ข้อมูลประวัติ -->
                        </tbody>
                    </table>
                </div>
                <div style="margin-top: 15px; text-align: right;">
                    <button class="action-btn red-btn" onclick="clearHistory()">🗑️ ล้างประวัติทั้งหมด</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Custom Modal -->
    <div id="customModal" class="modal-overlay">
        <div class="modal-box">
            <h3 id="modalTitle">แจ้งเตือน</h3>
            <p id="modalMessage">ข้อความแจ้งเตือน...</p>
            <div style="text-align: right;">
                <button class="action-btn" onclick="closeModal()">ตกลง</button>
            </div>
        </div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');
        let selectedBasePath = '';
        let fetchedImagesData = [];

        function minimizeWindow() { ipcRenderer.send('window-minimize'); }
        function closeWindow() { ipcRenderer.send('window-close'); }

        function switchPage(pageId, btn) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            btn.classList.add('active');
            if(pageId === 'history') loadHistory();
        }

        function showAlert(title, message) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerText = message;
            document.getElementById('customModal').style.display = 'flex';
        }
        function closeModal() { document.getElementById('customModal').style.display = 'none'; }

        async function selectFolder() {
            let path = await ipcRenderer.invoke('dialog-select-folder');
            if (path) {
                selectedBasePath = path;
                document.getElementById('folderPathDisplay').innerText = path;
            }
        }

        async function fetchImages() {
            let url = document.getElementById('urlInput').value.trim();
            if (!url) { showAlert("แจ้งเตือน", "กรุณาใส่ URL ก่อนครับ"); return; }

            document.getElementById('statusBadge').innerText = "● กำลังดึงข้อมูล...";
            document.getElementById('statusBadge').style.color = "#ff9800";
            document.getElementById('imageGrid').innerHTML = "";

            let result = await ipcRenderer.invoke('fetch-manga', url);
            if (result.success) {
                fetchedImagesData = result.images.map((url, idx) => ({ url, selected: true }));
                renderImages();
                document.getElementById('statusBadge').innerText = "● โหลดเสร็จสิ้น";
                document.getElementById('statusBadge').style.color = "var(--btn-green)";
                document.getElementById('dlBtn').disabled = false;
            } else {
                document.getElementById('statusBadge').innerText = "● เกิดข้อผิดพลาด";
                document.getElementById('statusBadge').style.color = "var(--btn-red)";
                showAlert("ข้อผิดพลาด", result.error);
            }
        }

        function renderImages() {
            let grid = document.getElementById('imageGrid');
            grid.innerHTML = "";
            fetchedImagesData.forEach((item, idx) => {
                if(!item) return;
                let div = document.createElement('div');
                div.className = 'image-card';
                div.innerHTML = `
                    <input type="checkbox" ${item.selected ? 'checked' : ''} onchange="toggleCheck(${idx}, this)">
                    <img src="${item.url}" onerror="this.src='https://via.placeholder.com/180x220?text=Error'">
                    <span class="page-badge">Page ${idx + 1}</span>
                `;
                grid.appendChild(div);
            });
        }

        function toggleCheck(idx, chk) { fetchedImagesData[idx].selected = chk.checked; }
        function toggleSelectAll(status) {
            fetchedImagesData.forEach(item => item.selected = status);
            renderImages();
        }

        function deleteSelectedImages() {
            fetchedImagesData = fetchedImagesData.filter(item => !item.selected);
            renderImages();
        }

        async function downloadImages() {
            if (!selectedBasePath) { showAlert("แจ้งเตือน", "กรุณาเลือกที่เก็บโฟลเดอร์หลักก่อนครับ"); return; }
            let folderName = document.getElementById('folderNameInput').value.trim();
            if (!folderName) { showAlert("แจ้งเตือน", "กรุณาตั้งชื่อโฟลเดอร์ครับ"); return; }

            let selectedUrls = fetchedImagesData.filter(item => item.selected).map(item => item.url);
            if (selectedUrls.length === 0) { showAlert("แจ้งเตือน", "คุณยังไม่ได้เลือกรูปภาพเลยครับ"); return; }

            let result = await ipcRenderer.invoke('download-images', { images: selectedUrls, savePath: selectedBasePath, folderName });
            if (result.success) {
                showAlert("สำเร็จ", `ดาวน์โหลดสำเร็จ ${result.count} รูป\nบันทึกที่: ${selectedBasePath}/${folderName}`);
            } else {
                showAlert("ข้อผิดพลาด", result.error);
            }
        }

        async function loadHistory() {
            let history = await ipcRenderer.invoke('get-history');
            let tbody = document.getElementById('historyTableBody');
            tbody.innerHTML = "";
            history.reverse().forEach(item => {
                let tr = document.createElement('tr');
                tr.innerHTML = `<td>${item.time}</td><td>${item.folder}</td><td>${item.count} รูป</td><td>${item.path}</td>`;
                tbody.appendChild(tr);
            });
        }

        async function clearHistory() {
            await ipcRenderer.invoke('clear-history');
            loadHistory();
            showAlert("สำเร็จ", "ล้างประวัติการดาวน์โหลดเรียบร้อยแล้ว");
        }
    </script>
</body>
</html>
